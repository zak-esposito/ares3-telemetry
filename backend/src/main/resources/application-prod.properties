# --- prod profile: PostgreSQL (persistent) ---
# State survives Render restarts and free-tier spin-downs.
#
# DATABASE_URL must be a full JDBC URL with credentials embedded as query
# params, e.g.
#   jdbc:postgresql://HOST:5432/DBNAME?user=USER&password=PASS
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Production hardening (overrides application.properties defaults) ---
# Never auto-mutate the prod schema; fail fast if it drifts from the entities.
spring.jpa.hibernate.ddl-auto=validate
# Don't leak component-level health details to anonymous callers.
management.endpoint.health.show-details=when-authorized
