spring.application.name=ares3-telemetry

# --- Active profile ---
# Local dev defaults to H2 (dev profile). Production overrides this with
# SPRING_PROFILES_ACTIVE=prod (set in the Dockerfile) to use PostgreSQL.
spring.profiles.active=dev

# --- JPA / Hibernate (common to all profiles) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --- External API keys (from environment) ---
# NASA Image and Video Library API (images-api.nasa.gov) needs no key.
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.model=claude-sonnet-4-6
