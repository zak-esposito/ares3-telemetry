spring.application.name=ares3-telemetry

# --- H2 in-memory database (dev) ---
spring.datasource.url=jdbc:h2:mem:ares3;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- H2 console (dev convenience) at /h2-console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --- External API keys (from environment) ---
# NASA Image and Video Library API (images-api.nasa.gov) needs no key.
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.model=claude-sonnet-4-6
